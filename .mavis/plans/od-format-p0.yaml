version: 1
plan:
  name: 'OpenDesigner P0：od-format 层实现 + 往返保真度实测'
  max_concurrency: 3
  max_consecutive_failures: 2
  max_cycles: 8
tasks:
  # ══════════ 第 1 轮：两个并行调研任务（只写各自的文档，互不重叠） ══════════
  - id: engine-semantics
    title: '摸清引擎语义层：组件/布局/变量/资源到底怎么表示'
    assigned_to: Coder
    timeout_ms: 1800000
    verified_by:
      - Verifier
    prompt: |
      仓库在 /workspace/OpenDesigner（git 仓库，main 分支，依赖已装好，**不要跑 npm install**）。
      你的任务：把 @open-pencil/scene-graph@0.16.0 的**语义层**摸清楚，产出一份可被机器复核的调研文档。

      ## 背景（为什么这事重要）
      项目的差异层是自研的 od-format：文本 JSON ⇄ 引擎文档双向序列化。
      docs/research.md §5.1 第 4 条明确写了：**序列化保真度是整个差异层的技术命门，
      组件 + 自动布局 + 变量 三者 round-trip 无损才算成立，必须先实测再立项。**
      之前的 Phase 0 只摸清了 SceneNode 的 154 个字段（见 docs/sdk-notes.md §3），
      **那是"字段层"，不是"语义层"** —— 组件、实例、override、自动布局、主题模式这些
      到底存在哪、怎么表达、能不能往返，全是空白。你填这个空白。

      ## 源码位置
      - node_modules/@open-pencil/scene-graph/dist/types.d.ts（类型声明）
      - node_modules/@open-pencil/scene-graph/src/**（源码，含注释，比 .d.ts 信息多）
      - 必要时看 node_modules/@open-pencil/core/src/**（core 是上层，engine 语义多半在 scene-graph）

      ## 必须回答的问题（逐条给结论 + `file:line` 引用，不许猜）
      1. **组件 / 实例 / override**：SceneNode 里承载组件语义的字段是哪几个（字段名 + 类型）？
         `SceneGraph.enabledLibraries`（Map<string, EnabledLibraryBinding>）和
         `SceneGraph.instanceIndex`（Map<string, Set<string>>）分别承载什么语义？
         实例的属性覆盖（override）存在哪里、怎么表达？
      2. **自动布局**：SceneNode 里哪些字段承载布局语义（绝对定位 / flow / gap / padding /
         justify / align）？字段名与类型是什么？布局是引擎自研还是外部引擎（Yoga）？
      3. **变量与主题**：`graph.variables` / `graph.variableCollections` / `graph.activeMode`
         三者的关系；mode（主题）在哪表达；变量绑定的字段路径格式有哪些合法取值
         （参考 scene-graph/src/variables/fields.ts 与 variables.ts 的 bindVariable）。
      4. **图片资源**：`graph.images`（Map<string, Uint8Array>）的 key 是什么语义？
         节点上引用图片的字段是哪个？图片在序列化时应该走 base64 还是外置资产（结合 research.md 的洁净室要求判断）。
      5. **派生缓存完整清单**：哪些字段是引擎算出来的缓存、序列化时必须剔除、加载时必须重算？
         （已知至少有 derivedLayout / derivedTextGlyphs / variableBindingScales /
         variableAssignmentScales / absPosCache 类的东西，**请找全**，
         判据是「有没有对应的 setter / 有没有重算入口」）
      6. **确定性 ID**：`new SceneGraph(idGenerator?: () => string)` 支持注入 ID 生成器。
         确认这个注入点的确切语义（调用时机、是否影响内部 ID 分配），
         并给出「让引擎在 od-format 往返后保持同一套 ID」的实现思路。
      7. **现成的序列化 API**：SceneGraph 上有没有现成的 toJSON / fromJSON / export / import？
         如果有，列出签名与行为；没有就明说没有。
      8. **往返时的隐藏状态**：除了节点字段，SceneGraph 上还有哪些实例级状态
         （nodes / images / variables / variableCollections / activeMode / enabledLibraries /
         instanceIndex / rootId / documentColorSpace / figKiwiVersion ...）需要一起往返？
         哪些可以安全丢弃？

      ## 产出（只准写这两个文件，别碰别的）
      - `docs/engine-semantics.md` —— 调研报告。每个结论必须有 `file:line` 引用；
        明确区分「实测确认」和「推断」；推断的部分要标注推断依据。
      - `scripts/gen-engine-semantics.py` —— **机器生成字段清单的脚本**，从
        node_modules/@open-pencil/scene-graph/dist/types.d.ts 解析出
        字段名 / 类型 / 分类（语义字段 / 派生缓存 / 二进制 / 对象），
        输出的清单必须和 docs/engine-semantics.md 里引用的清单一致。
        参考已有的 scripts/gen-field-list.py 的做法（同类脚本，照着它的风格写）。
        **不许手抄字段表**——手抄的清单不许通过验证。

      ## 硬性约束
      - 不要修改 packages/ 下任何文件
      - 不要修改 PLAN.md / docs/research.md / docs/competitive-review.md / docs/sdk-notes.md /
        HANDOFF.md / START_PROMPT.txt / shell/**
      - 不要执行 git commit / git add（owner 统一提交，避免多个 worker 抢索引）
      - 不要跑 npm install（依赖已装好）
      - 结论必须能被复核：每条都给出文件路径 + 行号

      ## 完成标准
      1. docs/engine-semantics.md 覆盖上述 8 个问题，每条带 file:line
      2. scripts/gen-engine-semantics.py 能独立运行，输出清单字段数与文档一致
      3. 报告里明确回答 research.md 的命门：组件 / 自动布局 / 变量 三类，
         各自的**往返可行性判断依据**（能不能无损往返、障碍在哪）

      完成后输出：产出文件路径 + 8 个问题的一句话答案清单 + 任何你没能确认的点。
    verify_prompt: |
      你是独立验证者，**只读不改**（不要修改项目任何文件，不要 git commit）。

      任务：独立核验 /workspace/OpenDesigner/docs/engine-semantics.md 与
      /workspace/OpenDesigner/scripts/gen-engine-semantics.py 的结论是否属实。

      不要相信产出者的自述。**自己动手重新查证**：
      1. 随机挑 8 条文档里的 file:line 断言，逐条打开源文件核对字段名、类型、语义是否属实。
         凡是行号对不上、字段名不存在、或语义被夸大的，记为 FAIL 项。
      2. 独立运行 `python3 scripts/gen-engine-semantics.py`（自己看它怎么写的、怎么解析的），
         确认输出清单的字段数，并核对文档里引用的清单是否与脚本输出一致。
         **如果清单是手抄的（脚本只是打印常量），直接 FAIL。**
      3. 自己用 node/tsx 探一下引擎真实行为，挑 2 个关键问题（比如变量绑定的字段路径格式、
         idGenerator 注入的调用时机）写个最小脚本实测，验证文档说法与运行时行为一致。
      4. 核验 8 个问题是否都被回答，特别是 research.md §5.1 命门那三类
         （组件/自动布局/变量）的往返可行性判断有没有给出依据，还是只有空话。

      产出：PASS 或 FAIL。FAIL 必须列出：每条问题 = 现象 + 复现命令 + 期望 vs 实际。
      不要修改任何项目文件。

  - id: od-format-spec
    title: 'od-format 规格：语义 ID、字段映射、版本迁移、CLI 契约'
    assigned_to: General
    timeout_ms: 1800000
    verified_by:
      - Verifier
    prompt: |
      仓库在 /workspace/OpenDesigner（依赖已装好，**不要跑 npm install**）。
      你的任务：写出 **od-format v0.1 规格文档** —— 自研文本文档格式的设计说明书。

      ## 背景
      OpenDesigner 的差异层是 od-format：**文本 JSON ⇄ @open-pencil 引擎文档双向序列化层**。
      上游引擎的文档模型是 `SceneGraph`（节点层 `SceneNode`，154 个字段）。
      目标是：agent 能直接读写文本文件、人能读懂、git diff 友好。
      规格要能直接指导下一步实现（packages/od-format）。

      ## 已有输入（都要读）
      - `docs/sdk-notes.md` §3 —— Phase 0 的 **154 字段全表**（机器生成，已核实）
      - `docs/sdk-notes.md` §4 —— 文本序列化可行性结论 + 已识别的 4 个坑
        （ID 不语义化 / 派生字段必须剔除 / 图片别内联 base64 / undefined 字段用 .optional()）
      - `docs/research.md` §3.2 —— 竞品 pen.dev 的 `.pen` schema 设计（**只作设计启发，不得抄**；
        research.md §7 写了洁净室红线：不复用竞品代码/品牌/资源，格式必须独立设计）
      - `docs/research.md` §5.1 —— 为什么是"复用上游引擎 + 自研文本格式层"这条路
      - `docs/engine-semantics.md` —— 另一个 worker 正在写的引擎语义层调研。
        **如果这个文件还不存在，就先按你手头的信息写，把拿不准的地方标成
        「待 engine-semantics 核实」并在文末列一个待核实清单**；如果存在，采信它。

      ## 规格必须覆盖（每节都要给出可执行的结论，不要泛泛而谈）
      1. **od 文档的顶层结构**：version / 文档元信息 / 节点集合 / 资源 / 变量与集合 /
         主题模式 / 引擎 ID 映射表，各自的形状与为什么这么设计。
      2. **语义 ID 层（最核心）**：引擎 ID 是 `${随机会话号}:${计数器}`，每次跑都不一样，
         diff 全是噪音。设计 odId ↔ engineId 的映射：
         - odId 长什么样（可读？带路径？带类型前缀？）
         - 映射表存在 od 文档的哪个位置
         - 往返后如何保证同一节点还是同一个 odId
         - 节点被删/被复制时 odId 怎么维护
         - **给出一个具体的 ID 方案，不要只说"要做语义 ID"**
      3. **字段映射表**：od 字段 ← 引擎字段。哪些字段原样映射、哪些改名、哪些剔除
         （派生缓存清单）、哪些拆/合（例：fills 数组、变量绑定路径）。
         给出成对的表格：引擎字段名 → od 字段名 → 处理方式（原样/改名/剔除/派生）。
      4. **三类硬骨头的 od 侧表达 + 往返可行性**（research.md 说的命门）：
         - **组件 / 实例 / override**
         - **自动布局**
         - **变量 + 主题模式**
         每类都要：od 侧结构长什么样、往返时哪些信息会丢、结论是「可行 / 有条件可行 / 不可行」+ 依据。
         **如果某类确实不可行，直接说不可行并给出替代方案** —— 这是本任务最有价值的输出。
      5. **版本策略与迁移框架**：od 文档的 version 字段怎么定义、迁移器接口长什么样
         （migrate(doc, from, to)）、v0.1→v1 的迁移怎么写、怎么保证迁移可逆/可测。
      6. **文本形态**：JSONC 注释容忍（竞品 .pen 就允许注释）、键顺序策略（要 diff 友好就得固定）、
         缩进、浮点精度、Unicode 转义策略。
      7. **公开 JSON Schema**：怎么从 zod schema 生成、生成产物放哪、怎么保证它跟实现不脱节。
      8. **CLI 契约**：`od convert` / `od inspect` / `od validate` 各自的参数、
         输入输出、退出码、错误信息格式。`od convert` 要能双向（引擎文档 ⇄ od 文本）。

      ## 产出（只准写这一个文件）
      - `docs/od-format-spec.md`

      ## 硬性约束
      - 不要修改 packages/ 下任何文件（实现是下一个任务的事）
      - 不要修改 PLAN.md / docs/research.md / docs/competitive-review.md / docs/sdk-notes.md /
        HANDOFF.md / START_PROMPT.txt / shell/**
      - 不要执行 git commit / git add
      - 不要跑 npm install
      - 不许引用 .pen schema 的字段名/结构来设计 od 格式（洁净室）——
        可以借鉴**设计思路**（比如 id+type 判别、flex 布局子集、变量用 $ 前缀绑定），
        但 od 格式的命名与结构必须自己定

      ## 完成标准
      规格细到另一个工程师照着能直接写实现，不需要再问设计问题。

      完成后输出：产出路径 + 8 节的要点摘要 + 三类硬骨头的可行性结论各一句话。
    verify_prompt: |
      你是独立验证者，**只读不改**（不要修改项目任何文件，不要 git commit）。

      核验 /workspace/OpenDesigner/docs/od-format-spec.md：

      1. **可执行性**：挑出规格里 3 个最关键的设计决策（语义 ID 方案、字段映射表、
         三类硬骨头的 od 侧结构），自己按描述在纸上推演一遍：
         能不能据此写出实现？有没有前后矛盾、定义不清、循环依赖？有问题记 FAIL。
      2. **事实核对**：规格里凡是声称引擎行为的（字段名、API、是否存在某方法），
         自己去 node_modules/@open-pencil/scene-graph 里核对，不要相信文档转述。
         字段名对不上、API 实际不存在，记 FAIL。
      3. **洁净室检查**（research.md §7 是硬红线）：
         读 research.md §7.2「绝对不要碰」的清单，然后检查 od-format-spec.md 里
         有没有直接复用竞品 `.pen` 的字段名或结构（例如直接叫 fill/strokes 之外的
         竞品专有命名、照搬其节点类型全集）。**若发现照搬，FAIL 并指出具体段落。**
      4. **洞见检验**：三类硬骨头（组件/自动布局/变量）的结论有没有**依据**，
         还是只是"应该可以"？把没有依据的结论挑出来列为 FAIL 项。
      5. **一致性**：规格里承诺的 API 名称，是否和 packages/od-format/src/index.ts
         骨架里导出注释承诺的一致？不一致要指出（以哪个为准要说清楚）。

      产出：PASS 或 FAIL。FAIL 列出具体条目 + 为什么是问题 + 建议怎么改。
      不要修改任何项目文件。

  # ══════════ 第 2 轮：实现（依赖两个调研结果） ══════════
  - id: od-format-impl
    title: '实现 od-format 序列化层 + od 命令行'
    assigned_to: Coder
    depends_on:
      - engine-semantics
      - od-format-spec
    timeout_ms: 1800000
    verified_by:
      - Verifier
    prompt: |
      仓库在 /workspace/OpenDesigner（依赖已装好，**不要跑 npm install**）。
      你的任务：按规格把 **od-format 包和 od 命令行实现出来**，并自带单元测试。

      ## 必读（按顺序）
      1. `docs/od-format-spec.md` —— 规格（上一个任务产出，**以它为准**）
      2. `docs/engine-semantics.md` —— 引擎语义层实测调研
      3. `docs/sdk-notes.md` §3/§4 —— 154 字段全表 + 序列化可行性 + 4 个坑
      4. `packages/od-format/src/index.ts` —— 骨架里导出注释承诺的 API 形状
      5. `packages/od-format/tests/smoke.test.ts` —— 已有的自检（别删）

      ## 要实现的东西
      ### packages/od-format/src/
      - `schema.ts` —— zod schema 描述 od 文档（含 version、节点、映射表、资源、变量、主题模式）
      - `ids.ts` —— 语义 ID：odId 生成、odId ↔ engineId 映射维护、节点增删时的维护规则
      - `serialize.ts` —— 引擎文档 → od 文档；派生缓存字段剔除；字段映射；固定键顺序
      - `deserialize.ts` —— od 文档 → 引擎文档；**用注入的 idGenerator 恢复 engineId**
      - `migrate.ts` —— 版本迁移框架 migrate(doc, from, to)
      - `index.ts` —— 统一导出（对齐骨架里承诺的 API 名称）

      ### packages/od-cli/src/cli.ts
      - `od convert <in> <out>` —— 双向转换（引擎文档 ⇄ od 文本）
      - `od inspect <file>` —— 打印结构摘要（节点数、字段数、变量、主题、资源）
      - `od validate <file>` —— 用 schema 校验 + 报告具体问题
      - 退出码约定、错误信息格式按规格来
      - 用 `tsx` 跑（根 package.json 已有 `npm run od` 脚本）

      ### 测试
      - 在 `packages/od-format/tests/` 下写你的单元测试（**不要动 tests/fidelity/**，
        那是下一个任务的目录）
      - **关键：往返测试必须断言"语义等价"而不是"字段没丢"**。
        平凡往返（同一对象 JSON.stringify→parse）不算数。
        要断言：往返后节点树结构一致、父子关系一致、变量绑定关系一致、
        变量/集合/主题模式数量与内容一致、引擎 ID 映射表一致。

      ## 技术约束（已锁定，别自己改）
      - zod **4.6.7**：注意 `z.record()` 要两个参数 `z.record(z.string(), z.unknown())`；
        `.optional()` / `.nullable()` 语义不变；校验失败看 `result.error.issues`
      - vitest **5.1.0**、typescript **5.9.3**（严格模式 + noUncheckedIndexedAccess）
      - 依赖只有 `@open-pencil/scene-graph@0.16.0` 和 `zod`。
        **不要引入新依赖**，不要装 @open-pencil/core（不需要渲染后端）
      - 用 `new SceneGraph(idGenerator)` 注入 ID 生成器实现确定性往返
      - JSON 序列化用 `Buffer.byteLength` 算字节数（不是 json.length，那是 UTF-16 码元数）

      ## 硬性约束
      - 只准改 packages/od-format/ 和 packages/od-cli/ 下面的文件
      - 不要修改 PLAN.md / docs/** / HANDOFF.md / START_PROMPT.txt / shell/**
      - 不要执行 git commit / git add
      - 不要跑 npm install

      ## 完成标准（自己必须先跑通）
      ```
      npx tsc -p tsconfig.json --noEmit        # 无错误
      npx vitest run                            # 全绿
      npm run od -- validate <某个生成的 od 文档>   # 能跑
      ```
      完成后输出：改了哪些文件、公开 API 列表、测试数量与运行输出、
      以及**你发现但没解决的已知问题**（尤其是三类硬骨头里没能做到无损往返的部分）。

      如果规格里有做不到的地方，**不要假装做到了** —— 在最终输出里明确说哪部分没做、
      为什么，并把代码里的 TODO 写清楚。
    verify_prompt: |
      你是独立验证者，**只读不改**（不要修改项目任何文件，不要 git commit）。

      核验 /workspace/OpenDesigner/packages/od-format 与 packages/od-cli 的实现：

      1. **自己跑**：`npx tsc -p tsconfig.json --noEmit`、`npx vitest run`、
         `npm run od -- --help`。命令跑不通 = FAIL。不要只读代码。
      2. **验往返不是平凡往返**（这是本任务的核心）：
         自己写一个临时脚本放在 $TMPDIR（不要放进项目），用 @open-pencil/scene-graph
         造一个**含父子层级 + 变量绑定 + 至少 3 个节点**的文档，
         走一遍「引擎 → od → 引擎」，然后**独立断言结构等价**：
         节点数、父子关系、变量绑定路径与目标 id、每个节点的关键几何字段。
         如果往返后信息丢了（哪怕生产者的测试没覆盖），FAIL 并指出丢了什么。
      3. **验派生字段确实被剔除**：在往返产物里找 derivedLayout / derivedTextGlyphs /
         variableBindingScales 这类派生缓存，如果出现在 od 输出里，FAIL。
      4. **验 ID 策略真的成立**：往返两次（引擎→od→引擎→od），确认 odId 稳定、
         引擎 ID 可复现（注入 idGenerator 生效），不是每次都不一样。
      5. **验 CLI 契约**：convert 双向都试一遍（od→引擎、引擎→od），
         validate 对一个**故意损坏**的文件要能报出具体问题而不是崩掉。
      6. **审查实现质量**：有没有把 engineId 随机值泄漏进 od 输出（那是规格明令禁止的）、
         有没有把 undefined 当 null 序列化（规格要求 .optional()）、
         有没有硬编码而不是走 schema。

      产出：PASS 或 FAIL。FAIL 必须给出：复现命令、期望、实际、影响范围。
      不要修改任何项目文件。

  # ══════════ 第 3 轮：独立验收（research.md §6.4 的 P0 验收标准） ══════════
  - id: fidelity-acceptance
    title: 'P0 验收：组件/布局/变量/资源四类真实往返 + 验收报告'
    assigned_to: General
    depends_on:
      - od-format-impl
    timeout_ms: 1800000
    verified_by:
      - Verifier
    prompt: |
      仓库在 /workspace/OpenDesigner（依赖已装好，**不要跑 npm install**）。
      你的任务：**独立验收 od-format 的往返保真度**，并产出验收报告。

      为什么单独一个任务：docs/research.md §6.4 的 P0 验收标准是
      「一个 .json 设计文件能被读写往返；v1→v2 迁移有测试覆盖；引擎可在 Node 里 headless 运行」，
      而 §5.1 说「组件 + 自动布局 + 变量 三者 round-trip 无损才算成立」。
      上一个任务交付的是实现；**你负责证明它到底行不行，不行就明说不行**。

      ## 产出（只准写这两个位置）
      1. `packages/od-format/tests/fidelity/` —— 验收测试套件
         （**不要动** packages/od-format/src/、packages/od-cli/、其它 tests 目录）
      2. `docs/p0-acceptance.md` —— 验收报告

      ## 测试套件要求（四类场景，每类都要有**非平凡**的断言）
      1. **组件 / 实例 / override**：用引擎 API 造出组件源 + 实例 + 属性覆盖，
         往返后断言组件关系、实例关系、覆盖值**全部还在且指向正确**。
         （引擎 API 怎么用，看 docs/engine-semantics.md 的调研结论；
         如果引擎其实不支持某种语义，如实写"引擎层面就不支持"，
         并给出**引擎层证据**，而不是 od-format 的锅）
      2. **自动布局**：造出带 flow 布局 + gap/padding 的节点树，
         往返后断言布局相关字段与层级关系不变。
      3. **变量 + 主题模式**：造变量、变量集合、mode，
         绑定到节点字段上（含颜色绑定路径 fills/0/color 这种），
         往返后断言变量定义、绑定路径、绑定目标 id、mode 全部一致。
      4. **图片资源**：放一张图进 graph.images 并在节点上引用，
         往返后断言资源能被正确还原（base64 还是外置资产，按规格来）。
      5. **结构等价 oracle**：写一个通用的结构等价判定函数
         （比较两棵引擎文档树：节点数、层级、关键字段、变量、资源），
         所有场景都用它，不要每个场景各写一套 ad-hoc 断言。
      6. **迁移**：按规格写一个 v0.1 → v0.2（或规格里定义的下一版本）的迁移器，
         并测「迁移前后语义等价」。

      ## 验收报告 docs/p0-acceptance.md 必须包含
      - 一张表：四类场景 × 「往返是否无损」× 「证据（测试名 + 真实输出）」× 「损失的细节」
      - 明确结论：**P0 验收标准（research.md §6.4）逐条 PASS / FAIL / 部分**
      - 如果某类不成立：写清楚是「引擎不支持」还是「od-format 设计缺陷」，
          以及**可执行的绕行方案**（如果有）
      - 贴**真实命令输出**，不许写"应该可以"

      ## 硬性约束
      - 不要修改 packages/od-format/src/、packages/od-cli/、docs/ 下其它文档、
        PLAN.md / research.md / competitive-review.md / sdk-notes.md / HANDOFF.md / shell/**
      - 不要执行 git commit / git add
      - 不要跑 npm install
      - 不许为了让测试通过而修改实现代码 —— 发现实现有问题就**报告 FAIL**，不要自己去修

      ## 完成标准
      ```
      npx vitest run packages/od-format/tests/fidelity/   # 全绿或明确标出哪些场景是已知不成立
      ```
      完成后输出：场景清单 + 每个场景的 PASS/FAIL + 报告路径 + 真实测试输出摘要。
    verify_prompt: |
      你是独立验证者，**只读不改**（不要修改项目任何文件，不要 git commit）。

      核验 /workspace/OpenDesigner/packages/od-format/tests/fidelity/ 与 docs/p0-acceptance.md：

      1. **自己跑测试**：`npx vitest run packages/od-format/tests/fidelity/`。
         跑不通或全红 = FAIL。
      2. **亲自复现最关键的那一类**：在 $TMPDIR 里写自己的脚本（别放进项目），
         用引擎 API 造一个**同时含组件实例 + 变量绑定 + 父子层级**的文档，
         独立跑「引擎→od→引擎」，逐项比对节点树、变量绑定、资源。
         以你的复现结果为准，不看生产者的结论。
      3. **查"假通过"**：读测试源码，找有没有这些糊弄写法——
         只断言 `expect(doc).toBeDefined()`、只比较节点数量、只断言 JSON 字符串相等、
         把往返当成同对象比较、`toMatchSnapshot()` 但快照是现生成的、
         try/catch 把异常吞掉当通过。发现就 FAIL 并指出位置。
      4. **核验报告诚实性**：报告里标 PASS 的场景，是不是真有对应测试且测试真的覆盖了那个断言？
         有没有把"引擎不支持"写成"od-format 可行"来充数？标 FAIL 的是不是被偷偷
         在实现里绕过去了（去看 src/ 有没有为绕过某场景塞的特殊逻辑）？
      5. **对照 research.md §6.4 的 P0 验收标准**逐条核：报告的结论和测试证据对得上吗？

      产出：PASS 或 FAIL。FAIL 列出：哪一类场景其实没被真正验证、测试里的假通过写法
      （给文件行号）、以及报告与证据不符之处。不要修改任何项目文件。
